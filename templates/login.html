<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Honda Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;
align-items:center;justify-content:center;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#111827,#26364c);
color:white;padding:20px
}
.login{
width:100%;max-width:390px;background:white;
color:#222;padding:30px;border-radius:18px;
box-shadow:0 15px 45px #0005
}
.logo{text-align:center;color:#c8102e;font-size:28px;font-weight:bold}
.sub{text-align:center;color:#666;margin:10px 0 25px}
input,button{
width:100%;padding:14px;margin:9px 0;
border-radius:8px;font-size:16px
}
input{border:1px solid #ccc}
button{border:0;background:#c8102e;color:white;font-weight:bold}
button:active{opacity:.8}
.error{color:#c8102e;text-align:center}
</style>
</head>
<body>
<div class="login">
<div class="logo">VISION HONDA</div>
<div class="sub">Master Dealership Management</div>
<form method="POST">
<input name="username" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>
{% with messages = get_flashed_messages() %}
{% for message in messages %}
<p class="error">{{ message }}</p>
{% endfor %}
{% endwith %}
</div>
</body>
</html>
